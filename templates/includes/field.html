<div class="fld {% if f.errors %}has-error{% endif %}">
  <label class="lbl" for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ f }}
  {% if f.help_text %}<small class="help">{{ f.help_text }}</small>{% endif %}
  {% for e in f.errors %}<small class="err">{{ e }}</small>{% endfor %}
</div>
