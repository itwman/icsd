{% if messages %}
<div class="wrap" style="padding-top:12px">
  {% for m in messages %}
    <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show icsd-alert" role="alert">
      {{ m }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="بستن"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
