{% load fa icons %}
<article class="card" style="--c1:{{ p.color }};--c2:{{ p.color }}">
  {% edit_btn p %}
  <a href="{{ p.get_absolute_url }}" class="card__link">
    <div class="card__ico">{% if p.logo %}<img src="{{ p.logo.url }}" alt="">{% else %}{% icon p.icon 22 %}{% endif %}</div>
    <h3>{{ p.name }}{% if p.latin_name %} <small class="mono">{{ p.latin_name }}</small>{% endif %}</h3>
    <p>{{ p.tagline }}</p>
    {% if p.category_label %}<span class="card__tag mono">{{ p.category_label }}</span>{% endif %}
  </a>
</article>
